<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0e12"><meta name="description" content="Obsidian Atlas — an explorable cultural world."><title>Obsidian Atlas</title>

<style>:root{color-scheme:dark;--ink:#f1eee7}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#080b0f}body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}#game{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;background:#080b0f}#atlas-ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:var(--ink)}.top{position:absolute;left:22px;right:22px;top:20px;display:flex;align-items:center;justify-content:space-between;gap:18px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 14px #000}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.mark{display:grid;place-items:center;width:25px;height:25px;border:1px solid rgba(255,255,255,.55);border-radius:50%;font:400 12px Georgia,serif}.actions{display:flex;gap:6px;pointer-events:auto}.actions button{border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(6,9,12,.22);backdrop-filter:blur(12px);color:rgba(255,255,255,.68);padding:8px 10px;font:600 8px/1 Inter,system-ui;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.loc{position:absolute;left:22px;bottom:20px;font:600 8px/1 Inter,system-ui;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);text-shadow:0 2px 12px #000}.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);white-space:nowrap;font:600 8px/1 Inter,system-ui;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.52);text-shadow:0 2px 12px #000;transition:opacity .5s}.hint.soft,.hint.dim{opacity:.18}.dot{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.7);transform:translate(-50%,-50%)}.grade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 38%,rgba(0,0,0,.13) 74%,rgba(0,0,0,.38) 120%);mix-blend-mode:multiply}#fail{position:fixed;inset:0;z-index:99;display:none;place-items:center;background:#080b0f;color:#eee;font:600 11px Inter,system-ui}#fail.show{display:grid}@media(max-width:720px){.top{left:14px;right:14px;top:14px}.actions button{padding:7px 8px;font-size:7px}.loc{left:14px;bottom:14px}.hint{bottom:36px;font-size:7px}}#boot-status{position:fixed;left:50%;top:50%;z-index:50;transform:translate(-50%,-50%);font:600 8px/1 Inter,system-ui;letter-spacing:.18em;color:rgba(255,255,255,.62);text-transform:uppercase;text-shadow:0 2px 12px #000;pointer-events:none}#boot-status.error{color:#ff8b8b}</style></head><body><canvas id="game"></canvas><div id="atlas-ui"><div class="grade"></div><div class="top"><div class="brand"><span class="mark">A</span><span>OBSIDIAN ATLAS</span></div><div class="actions"><button id="signal">FRANK OCEAN</button><button id="sound" data-on="0">SOUND OFF</button></div></div><div class="dot"></div><div id="location" class="loc">CULTURAL DISTRICT</div><div id="hint" class="hint">CLICK WORLD · WASD MOVE · SHIFT RUN · V CAMERA</div></div><div id="fail">RENDERER FAILED</div><div id="boot-status">INITIALIZING WORLD</div><script type="module" src="/loader.js"></script></body></html>
